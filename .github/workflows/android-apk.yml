name: Build Suhood APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform 35 and build-tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run unit tests
        run: ./gradlew --no-daemon test --stacktrace

      - name: Generate CI release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$HOME/suhood-release.jks" \
            -storepass suhoodci \
            -keypass suhoodci \
            -alias suhood \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Suhood CI, OU=Mobile, O=Suhood, L=City, ST=State, C=US"
          echo "SUHOOD_KEYSTORE_PATH=$HOME/suhood-release.jks" >> $GITHUB_ENV
          echo "SUHOOD_KEYSTORE_PASSWORD=suhoodci" >> $GITHUB_ENV
          echo "SUHOOD_KEY_ALIAS=suhood" >> $GITHUB_ENV
          echo "SUHOOD_KEY_PASSWORD=suhoodci" >> $GITHUB_ENV

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease --stacktrace
        env:
          SUHOOD_KEYSTORE_PATH: ${{ env.SUHOOD_KEYSTORE_PATH }}
          SUHOOD_KEYSTORE_PASSWORD: ${{ env.SUHOOD_KEYSTORE_PASSWORD }}
          SUHOOD_KEY_ALIAS: ${{ env.SUHOOD_KEY_ALIAS }}
          SUHOOD_KEY_PASSWORD: ${{ env.SUHOOD_KEY_PASSWORD }}

      - name: Build debug APK (fallback install path)
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APKs
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          test -n "$(find app/build/outputs/apk/release -name '*.apk' | head -1)"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: suhood-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: suhood-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
