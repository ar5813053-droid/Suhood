name: Build Suhood Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # Google removed the legacy SDK "tools" package. setup-android@v3
      # still requests it by default and fails with:
      #   Failed to find package 'tools'
      # v4 defaults to platform-tools only and accepts SDK licenses.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      # Install platform + build-tools required by compileSdk/targetSdk 35.
      # AGP can download these itself once licenses are accepted; this makes
      # the first Gradle run more reliable on a clean runner.
      - name: Install Android platform 35 and build-tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run unit tests
        run: ./gradlew --no-daemon test --stacktrace

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found under app/build/outputs/apk/debug"
            find app/build -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: suhood-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
